name: 'publish-staging'

on:
  workflow_dispatch:
  push:
    branches:
      - staging

jobs:
  publish-tauri:
    permissions:
      contents: write # Required to create a release
      actions: read # Required to fetch release information
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # For Arm based macs (M1 and above). Use macos-14 for Intel based macs.
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # For Intel based macs. Use macos-14 for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm' # Set this to npm, yarn or pnpm. Adjust if you use a different package manager.

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: npm install # !!! Important: Change this to 'npm install' or 'pnpm install' if you use npm or pnpm respectively !!!

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          packageManager: npm # Explicitly tell the action to use npm
          # buildCommand: 'npm run build' # Optional: Uncomment and adjust if your build script is different
          tagName: staging-v__VERSION__ # Different tag format for staging releases
          releaseName: 'Staging v__VERSION__'
          releaseBody: 'This is a staging release. See the assets to download this version and install.'
          releaseDraft: false # Creates a draft release. Set to false to publish immediately.
          prerelease: true # Mark as prerelease so it's not considered the "latest" release
          args: ${{ matrix.args }}

  create-release-info:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to update releases
    steps:
      - name: Fetch latest staging release info
        id: fetch-release
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            // Get the latest staging (prerelease) release
            const { data: releases } = await github.rest.repos.listReleases({
              owner: 'noriskclient',
              repo: 'noriskclient-launcher'
            });

            const stagingRelease = releases.find(release => release.prerelease && release.tag_name.startsWith('staging-'));
            if (!stagingRelease) {
              console.log('No staging release found');
              return '';
            }

            console.log(`Found staging release: ${stagingRelease.tag_name} (ID: ${stagingRelease.id})`);
            const fs = require('fs');
            fs.writeFileSync('latest-staging.json', JSON.stringify(stagingRelease, null, 2));
            return stagingRelease.tag_name;

      - name: Find latest main release
        id: find-release
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            // Get the latest non-prerelease release (main release)
            const { data: releases } = await github.rest.repos.listReleases({
              owner: 'noriskclient',
              repo: 'noriskclient-launcher'
            });

            const mainRelease = releases.find(release => !release.prerelease);
            if (!mainRelease) {
              console.log('No main release found');
              return '';
            }

            console.log(`Found main release: ${mainRelease.tag_name} (ID: ${mainRelease.id})`);
            return mainRelease.upload_url;

      - name: Upload release info to main release
        if: steps.fetch-release.outputs.result != '' && steps.find-release.outputs.result != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.find-release.outputs.result }}
          asset_path: ./latest-staging.json
          asset_name: latest-staging.json
          asset_content_type: application/json
